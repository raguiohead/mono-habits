# Compila o APK Android de debug a cada push nas branches main e feat/android (e manualmente via workflow_dispatch).
# O runner ubuntu-latest já contém o Android SDK pré-instalado em ANDROID_HOME.
name: Build do APK Android

on:
  push:
    branches: [main, feat/android]
  workflow_dispatch:

concurrency:
  # Por branch: um push na feat/android não cancela o build da main que publica a Release
  group: build-android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci

      - name: Build web e sincronização com Capacitor
        run: npm run cap:sync
        env:
          # Opcionais: se não existirem como segredos, valem os padrões de src/lib/firebase.ts
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - run: chmod +x android/gradlew

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Salvar artefato do APK
        uses: actions/upload-artifact@v7
        with:
          name: mono-habits-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Baixar artefato do APK
        uses: actions/download-artifact@v8
        with:
          name: mono-habits-debug
          path: .

      - name: Criar GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          git fetch --tags
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || gh release view "$TAG" >/dev/null 2>&1; then
            echo "Tag ou Release $TAG já existe. Pulando sem falhar."
          else
            APK_FILE=$(find . -name "*.apk" | head -n 1)
            cp "$APK_FILE" mono-habits.apk
            gh release create "$TAG" mono-habits.apk --target "${{ github.sha }}" --title "Release $TAG" --generate-notes
          fi
