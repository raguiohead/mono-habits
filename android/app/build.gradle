apply plugin: 'com.android.application'
import groovy.json.JsonSlurper

def packageJsonFile = file('../../package.json')
def packageJson = new JsonSlurper().parseText(packageJsonFile.text)
def appVersion = (packageJson.version ?: "1.0.0").toString()
def versionParts = appVersion.tokenize('.').collect { it.toInteger() }
def appVersionCode = (versionParts[0] * 10000) + (versionParts[1] * 100) + versionParts[2]

def releaseStoreFile = System.getenv("ANDROID_KEYSTORE_PATH") ?: (project.findProperty("MONO_RELEASE_STORE_FILE") ?: "")
def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: (project.findProperty("MONO_RELEASE_STORE_PASSWORD") ?: "")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: (project.findProperty("MONO_RELEASE_KEY_ALIAS") ?: "")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: (project.findProperty("MONO_RELEASE_KEY_PASSWORD") ?: "")

def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace = "com.raguiohead.monohabits"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.raguiohead.monohabits"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            // Utiliza automaticamente a chave de debug padrão (~/.android/debug.keystore)
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    if (taskGraph.allTasks.any { it.name in ['packageRelease', 'assembleRelease'] }) {
        if (!hasReleaseSigning) {
            throw new GradleException("Credenciais de assinatura de RELEASE ausentes! Configure MONO_RELEASE_* no ~/.gradle/gradle.properties ou variáveis de ambiente ANDROID_KEYSTORE_*.")
        }
        if (!file(releaseStoreFile).exists()) {
            throw new GradleException("Arquivo de keystore de RELEASE não encontrado em: ${releaseStoreFile}")
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
